name: Build & Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run test stage
        run: |
          docker build --target test -t tg-migrator:test .
          docker run --rm tg-migrator:test

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      dockerhub_enabled: ${{ steps.targets.outputs.dockerhub_enabled }}
      dockerhub_repo: ${{ steps.targets.outputs.dockerhub_repo }}
      ghcr_repo: ${{ steps.targets.outputs.ghcr_repo }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve target registries & sanitize credentials
        id: targets
        env:
          RAW_DH_USER_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_DH_USER_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          RAW_DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          GHCR_REPO=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr_repo=${GHCR_REPO}" >> "$GITHUB_OUTPUT"

          RAW_USER="${RAW_DH_USER_SECRET:-$RAW_DH_USER_VAR}"
          # If user pasted 'docker login -u <username>', extract just the username
          if printf '%s' "$RAW_USER" | grep -Eq 'docker[[:space:]]+login'; then
            RAW_USER=$(printf '%s' "$RAW_USER" | sed -E 's/.*-u[[:space:]]+([^[:space:]]+).*/\1/')
          fi
          # Strip whitespace, control chars, quotes, and lowercase Docker ID
          DH_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:][:cntrl:]"'"'" | tr '[:upper:]' '[:lower:]')

          # Extract dckr_pat_... token if present, otherwise strip whitespace/control chars/quotes
          if printf '%s' "$RAW_DH_TOKEN" | grep -Eo 'dckr_pat_[A-Za-z0-9_-]+' >/dev/null 2>&1; then
            DH_TOKEN=$(printf '%s' "$RAW_DH_TOKEN" | grep -Eo 'dckr_pat_[A-Za-z0-9_-]+' | head -n 1)
          else
            DH_TOKEN=$(printf '%s' "$RAW_DH_TOKEN" | sed -E 's/^[Bb]earer[[:space:]]+//' | tr -d '[:space:][:cntrl:]"'"'")
          fi

          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "::add-mask::${DH_TOKEN}"
            USER_LEN=${#DH_USER}
            TOKEN_LEN=${#DH_TOKEN}
            echo "Docker Hub username resolved: '${DH_USER}' (length=${USER_LEN})"
            if printf '%s' "$DH_TOKEN" | grep -q '^dckr_pat_'; then
              echo "Docker Hub token format verified: dckr_pat_*** (length=${TOKEN_LEN})"
            else
              echo "::warning::DOCKERHUB_TOKEN does not start with 'dckr_pat_' (length=${TOKEN_LEN}). Make sure it is a valid Docker Hub Personal Access Token."
            fi
            if printf '%s' "$DH_USER" | grep -q '@'; then
              echo "::error::DOCKERHUB_USERNAME ('${DH_USER}') contains '@'. Please use your Docker Hub ID (username), not your email address."
              exit 1
            fi

            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "dh_user=${DH_USER}" >> "$GITHUB_OUTPUT"
            echo "dh_token=${DH_TOKEN}" >> "$GITHUB_OUTPUT"
            REPO_NAME=$(echo "${DH_REPO:-${DH_USER}/${GITHUB_REPOSITORY#*/}}" | tr -d '[:space:][:cntrl:]' | tr '[:upper:]' '[:lower:]')
            echo "dockerhub_repo=${REPO_NAME}" >> "$GITHUB_OUTPUT"
            {
              echo "images<<EOF"
              echo "${REPO_NAME}"
              echo "${GHCR_REPO}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "images=${GHCR_REPO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.targets.outputs.dh_user }}
          password: ${{ steps.targets.outputs.dh_token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push runtime image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.targets.outputs.images != '' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README.md to Docker Hub description
        if: steps.targets.outputs.dockerhub_enabled == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ steps.targets.outputs.dh_user }}
          password: ${{ steps.targets.outputs.dh_token }}
          repository: ${{ steps.targets.outputs.dockerhub_repo }}
          readme-filepath: ./README.md

  release:
    name: Create GitHub Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment assets and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          DH_ENABLED: ${{ needs.build-and-push.outputs.dockerhub_enabled }}
          DH_REPO: ${{ needs.build-and-push.outputs.dockerhub_repo }}
          GHCR_REPO: ${{ needs.build-and-push.outputs.ghcr_repo }}
        run: |
          CLEAN_VER="${VERSION#v}"
          {
            echo "### Docker Images (\`linux/amd64\`, \`linux/arm64\`)"
            echo ""
            if [ "$DH_ENABLED" = "true" ]; then
              echo "- **Docker Hub**: \`docker pull ${DH_REPO}:${CLEAN_VER}\`"
            fi
            echo "- **GHCR**: \`docker pull ${GHCR_REPO}:${CLEAN_VER}\`"
            echo ""
            echo "### Quick Deployment"
            echo "Download \`docker-compose.yml\` and \`.env.example\` from the release assets below, rename \`.env.example\` to \`.env\`, and start with \`docker compose up -d\`."
          } > release-notes-header.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes-header.md
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
