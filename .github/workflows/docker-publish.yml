name: Build & Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run test stage
        run: |
          docker build --target test -t tg-migrator:test .
          docker run --rm tg-migrator:test

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockerhub_repo: ${{ steps.targets.outputs.dockerhub_repo }}
      app_version: ${{ steps.targets.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub target & version
        id: targets
        env:
          RAW_DH_USER_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_DH_USER_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          RAW_DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          APP_VER=$(python3 -c 'import re, pathlib; m = re.search(r"__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]", pathlib.Path("app/__init__.py").read_text()); print(m.group(1) if m else "0.0.1")')
          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "Application version detected from app/__init__.py: ${APP_VER}"

          RAW_USER="${RAW_DH_USER_SECRET:-$RAW_DH_USER_VAR}"
          if printf '%s' "$RAW_USER" | grep -Eq 'docker[[:space:]]+login'; then
            RAW_USER=$(printf '%s' "$RAW_USER" | sed -E 's/.*-u[[:space:]]+([^[:space:]]+).*/\1/')
          fi
          DH_USER=$(printf '%s' "$RAW_USER" | tr -d '[:space:][:cntrl:]"'"'" | tr '[:upper:]' '[:lower:]')

          if printf '%s' "$RAW_DH_TOKEN" | grep -Eo 'dckr_pat_[A-Za-z0-9_-]+' >/dev/null 2>&1; then
            DH_TOKEN=$(printf '%s' "$RAW_DH_TOKEN" | grep -Eo 'dckr_pat_[A-Za-z0-9_-]+' | head -n 1)
          else
            DH_TOKEN=$(printf '%s' "$RAW_DH_TOKEN" | sed -E 's/^[Bb]earer[[:space:]]+//' | tr -d '[:space:][:cntrl:]"'"'")
          fi

          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured in repository secrets."
            exit 1
          fi

          echo "::add-mask::${DH_TOKEN}"
          echo "dh_user=${DH_USER}" >> "$GITHUB_OUTPUT"
          echo "dh_token=${DH_TOKEN}" >> "$GITHUB_OUTPUT"

          REPO_NAME=$(echo "${DH_REPO:-${DH_USER}/tg-migrator}" | tr -d '[:space:][:cntrl:]' | tr '[:upper:]' '[:lower:]')
          echo "dockerhub_repo=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "Target Docker Hub repository: ${REPO_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.targets.outputs.dh_user }}
          password: ${{ steps.targets.outputs.dh_token }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.dockerhub_repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.targets.outputs.app_version }},enable={{is_default_branch}}
            type=raw,value=v${{ steps.targets.outputs.app_version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push runtime image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README.md to Docker Hub description
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ steps.targets.outputs.dh_user }}
          password: ${{ steps.targets.outputs.dh_token }}
          repository: ${{ steps.targets.outputs.dockerhub_repo }}
          readme-filepath: ./README.md

  release:
    name: Create GitHub Release
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment assets and release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          APP_VER: ${{ needs.build-and-push.outputs.app_version }}
          DH_REPO: ${{ needs.build-and-push.outputs.dockerhub_repo }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            CLEAN_VER="${REF_NAME#v}"
          else
            CLEAN_VER="${APP_VER#v}"
          fi
          TAG_NAME="v${CLEAN_VER}"
          echo "clean_ver=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [[ "$REF_NAME" != v* ]] && gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; skipping automatic release creation."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

          CHANGELOG_BODY=$(python3 -c 'import pathlib, re, sys; ver = sys.argv[1]; p = pathlib.Path("CHANGELOG.md"); text = p.read_text(encoding="utf-8") if p.exists() else ""; m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, flags=re.M | re.S); print(m.group(1).strip() if m else "")' "$CLEAN_VER")

          {
            echo "### Docker Hub Image (\`linux/amd64\`, \`linux/arm64\`)"
            echo ""
            echo "- **Repository**: [${DH_REPO}](https://hub.docker.com/r/${DH_REPO})"
            echo "- **Pull Command**: \`docker pull ${DH_REPO}:${CLEAN_VER}\`"
            echo ""
            echo "### Quick Deployment"
            echo "Download \`docker-compose.yml\` and \`.env.example\` from the release assets below, rename \`.env.example\` to \`.env\`, and start with \`docker compose up -d\`."
            if [ -n "$CHANGELOG_BODY" ]; then
              echo ""
              echo "---"
              echo ""
              echo "$CHANGELOG_BODY"
            fi
          } > release-notes-header.md

      - name: Publish GitHub Release
        if: steps.notes.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag_name }}
          name: ${{ steps.notes.outputs.tag_name }}
          body_path: release-notes-header.md
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
