name: Build & Deploy Docs (Cloudflare Workers)

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build VitePress & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & build VitePress site
        working-directory: docs
        run: |
          npm install --no-audit --no-fund
          npm run docs:build

      - name: Check Cloudflare credentials
        id: cf_creds
        if: github.event_name != 'pull_request'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:][:cntrl:]')
          ACCOUNT=$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:][:cntrl:]')
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in repository secrets yet; skipping Cloudflare Workers deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::${TOKEN}"
            echo "cf_token=${TOKEN}" >> "$GITHUB_OUTPUT"
            echo "cf_account=${ACCOUNT}" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static assets to Cloudflare Workers
        if: github.event_name != 'pull_request' && steps.cf_creds.outputs.ready == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf_creds.outputs.cf_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf_creds.outputs.cf_account }}
        run: |
          npx wrangler deploy --config wrangler.jsonc --keep-vars
